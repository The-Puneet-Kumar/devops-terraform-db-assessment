services:
  db:
    image: postgres:16-alpine
    container_name: devops-assessment-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: bookings
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations/001_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d bookings"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: